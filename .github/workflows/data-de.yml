name: Német adatok frissítése

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

concurrency:
  group: data-de
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Időablak
        id: t
        run: |
          echo "slot=$(( $(date +%s) / 21600 ))" >> "$GITHUB_OUTPUT"

      - name: Statikus adatok (cache, 6 óránként frissül)
        uses: actions/cache@v4
        with:
          path: cache/static
          key: de-static-${{ steps.t.outputs.slot }}
          restore-keys: de-static-

      - name: Élő állapot (cache)
        uses: actions/cache@v4
        with:
          path: cache/state.json
          key: de-state-${{ github.run_id }}
          restore-keys: de-state-

      - name: Mobilithek tanúsítvány
        env:
          CERT: ${{ secrets.MOBILITHEK_CERT }}
          PW: ${{ secrets.MOBILITHEK_CERT_PASSWORD }}
        run: |
          echo "$CERT" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/c.p12"
          openssl pkcs12 -in "$RUNNER_TEMP/c.p12" -passin env:PW -nokeys -legacy -out "$RUNNER_TEMP/cert.pem" 2>/dev/null || openssl pkcs12 -in "$RUNNER_TEMP/c.p12" -passin env:PW -nokeys -out "$RUNNER_TEMP/cert.pem"
          openssl pkcs12 -in "$RUNNER_TEMP/c.p12" -passin env:PW -nocerts -nodes -legacy -out "$RUNNER_TEMP/key.pem" 2>/dev/null || openssl pkcs12 -in "$RUNNER_TEMP/c.p12" -passin env:PW -nocerts -nodes -out "$RUNNER_TEMP/key.pem"
          rm "$RUNNER_TEMP/c.p12"

      - name: Németország – Mobilithek letöltése és sűrítése
        run: python pipeline/de.py --cert "$RUNNER_TEMP/cert.pem" --key "$RUNNER_TEMP/key.pem" --cache cache --out out/de.json

      - name: Feltöltés Cloudflare KV-ba
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4 kv key put de.json --path out/de.json
          --namespace-id "${{ secrets.KV_NAMESPACE_ID }}" --remote

      - name: Tanúsítvány törlése
        if: always()
        run: rm -f "$RUNNER_TEMP/cert.pem" "$RUNNER_TEMP/key.pem"
