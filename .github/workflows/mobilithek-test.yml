name: Mobilithek probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Certificate
        env:
          CERT: ${{ secrets.MOBILITHEK_CERT }}
          PW: ${{ secrets.MOBILITHEK_CERT_PASSWORD }}
        run: |
          echo "$CERT" | tr -d ' \r\n' | base64 -d > c.p12
          openssl pkcs12 -in c.p12 -passin env:PW -nokeys -legacy -out cert.pem 2>/dev/null || openssl pkcs12 -in c.p12 -passin env:PW -nokeys -out cert.pem
          openssl pkcs12 -in c.p12 -passin env:PW -nocerts -nodes -legacy -out key.pem 2>/dev/null || openssl pkcs12 -in c.p12 -passin env:PW -nocerts -nodes -out key.pem
      - name: Probe
        run: |
          mkdir -p probe
          first=1
          for row in $(jq -r 'to_entries[] | .key as $k | .value | to_entries[] | "\($k|gsub(" ";"_"))|\(.key)|\(.value)"' pipeline/mobilithek_subs.json); do
            IFS='|' read name kind id <<< "$row"
            f="probe/${name}_${kind}"
            for url in "https://mobilithek.info:8443/mobilithek/api/v1.0/subscription/$id/clientPullService?subscriptionID=$id" "https://mobilithek.info:8443/mobilithek/api/v1.0/subscription?subscriptionID=$id"; do
              code=$(curl -s --compressed -m 240 -D "$f.h" -o "$f.body" -w '%{http_code}' --cert cert.pem --key key.pem -H 'Accept-Encoding: gzip' "$url")
              [ "$code" = "200" ] && break
            done
            echo "== $name $kind $id -> HTTP $code, $(stat -c%s $f.body) bytes, url=${url%%\?*}"
            grep -i "content-type\|content-encoding" "$f.h" | tr -d '\r'
            head -c 400 "$f.body"; echo
          done
      - name: Pack
        run: cd probe && for f in *.body; do head -c 3000000 "$f" > "${f%.body}.sample"; done; tar czf ../probe.tgz *.sample *.h
      - uses: actions/upload-artifact@v4
        with: {name: probe, path: probe.tgz, retention-days: 3}
