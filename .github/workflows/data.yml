name: Adatok frissítése

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ausztria – E-Control letöltése és sűrítése
        env:
          ECONTROL_API_KEY: ${{ secrets.ECONTROL_API_KEY }}
        run: python pipeline/build.py at --out out/at.json

      - name: Feltöltés Cloudflare KV-ba
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4 kv key put at.json --path out/at.json
          --namespace-id "${{ secrets.KV_NAMESPACE_ID }}" --remote
