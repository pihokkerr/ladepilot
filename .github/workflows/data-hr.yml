name: Horvát adatok frissítése

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency:
  group: data-hr
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Horvátország – Open Charge Map
        env:
          OCM_API_KEY: ${{ secrets.OCM_API_KEY }}
        run: python pipeline/ocm.py --country HR --out out/hr.json

      - name: Feltöltés Cloudflare KV-ba
        if: hashFiles('out/hr.json') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4 kv key put hr.json --path out/hr.json
          --namespace-id "${{ secrets.KV_NAMESPACE_ID }}" --remote
