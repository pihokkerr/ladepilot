name: Szlovén adatok frissítése

on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:

concurrency:
  group: data-si
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Időablak
        id: t
        run: echo "slot=$(( $(date +%s) / 21600 ))" >> "$GITHUB_OUTPUT"

      - name: Töltőtábla (cache, 6 óránként frissül)
        uses: actions/cache@v4
        with:
          path: cache/si_table.json
          key: si-table-${{ steps.t.outputs.slot }}
          restore-keys: si-table-

      - name: Szlovénia – NAP letöltése és sűrítése
        env:
          NAP_SI_USER: ${{ secrets.NAP_SI_USER }}
          NAP_SI_PASSWORD: ${{ secrets.NAP_SI_PASSWORD }}
        run: python pipeline/si.py --cache cache --out out/si.json

      - name: Feltöltés Cloudflare KV-ba
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4 kv key put si.json --path out/si.json
          --namespace-id "${{ secrets.KV_NAMESPACE_ID }}" --remote
