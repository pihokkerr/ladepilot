name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          U: ${{ secrets.NAP_SI_USER }}
          P: ${{ secrets.NAP_SI_PASSWORD }}
        run: |
          mkdir s
          for n in Table Status; do
            u="https://b2b.nap.si/data/b2b.prometej.energyInfrastructure${n}Publication"
            code=$(curl -s -m 300 --compressed -u "$U:$P" -H 'Accept-Encoding: gzip' -D h.txt -o "s/$n.xml" -w '%{http_code}' "$u")
            echo "== $n HTTP $code $(stat -c%s s/$n.xml) bytes"; grep -i "content-type\|content-encoding" h.txt
            head -c 300 "s/$n.xml"; echo
          done
          cd s && for f in *.xml; do head -c 3000000 "$f" | gzip -9 > "$f.gz"; rm "$f"; done
          git init -q -b probe && git add . && git -c user.name=bot -c user.email=bot@x commit -qm s
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe:probe-si
